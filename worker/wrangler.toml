name = "notes-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
keep_vars = true

# The built React app is served from the same origin as the API.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Production values. Local development overrides these from .dev.vars.
[vars]
# A large model follows the prompt's "answer only from the context" and "quote word for word"
# rules far more reliably than an 8B one, at roughly twice the Workers AI cost per question.
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
# With bge-base, unrelated text has scored up to 0.54 and real matches 0.59 and up.
CITATION_MIN_SCORE = "0.56"
AUTH_ENABLED = "true"
VECTOR_STORE = "vectorize"
# Per-user limits. Everyone shares one free Workers AI allowance and one vector index.
MAX_NOTES_PER_USER = "20"
MAX_CHUNKS_PER_USER = "1000"
MAX_QUESTIONS_PER_DAY = "30"

[[d1_databases]]
binding = "DB"
database_name = "notes-ai-db"
database_id = "117ca853-3d27-4082-98d8-b9f0b48607f1"

[[vectorize]]
binding = "VECTORIZE"
index_name = "notes-ai-index"

# Per-user limit on asking questions.
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Per-user limit on adding note text. A 1 MB note is uploaded as about 22 requests.
[[ratelimits]]
name = "INGEST_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
