name = "notes-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
keep_vars = true

# The built React app is served from the same origin as the API.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Production values. Local development overrides these from .dev.vars.
[vars]
# Llama 3 8B, which the assignment names, has been retired from Workers AI; 3.1 8B is its successor.
LLM_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
AUTH_ENABLED = "true"
VECTOR_STORE = "vectorize"

[[d1_databases]]
binding = "DB"
database_name = "notes-ai-db"
database_id = "117ca853-3d27-4082-98d8-b9f0b48607f1"

[[vectorize]]
binding = "VECTORIZE"
index_name = "notes-ai-index"

# Per-user limit on the routes that call the AI models (asking a question, adding a note).
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
